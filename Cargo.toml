[package]
name = "mancala-solver"
version = "0.1.0"
edition = "2021"
description = "An exact + heuristic position solver for Kalah-style Mancala"
license = "MIT"

[lib]
name = "mancala"
path = "src/lib.rs"
# rlib for the CLI/tests; cdylib so the wasm32 build emits a loadable `.wasm`.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mancala-solver"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
